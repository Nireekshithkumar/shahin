version: '3.8'

# ── ScholarSetu AI – Docker Compose ──────────────────────────────────────────
# Pull pre-built images from Docker Hub:
#   docker pull nireekshithkumar/projectbyshahin:backend-v1
#   docker pull nireekshithkumar/projectbyshahin:frontend-v1
#
# Start everything:
#   docker-compose up -d
# ─────────────────────────────────────────────────────────────────────────────

x-backend-env: &backend-env
  DB_ENGINE: ${DB_ENGINE:-postgresql}
  POSTGRES_DB: ${POSTGRES_DB:-scholarsetu_db}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:80}
  BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
  DEBUG: ${DEBUG:-False}
  SECRET_KEY: ${SECRET_KEY:-scholarsetu-docker-secret-change-in-prod-2026}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@scholarsetu.ai}
  SCHOLARSETU_SITE_NAME: ScholarSetu AI

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: scholarsetu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scholarsetu_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: scholarsetu_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django Backend ──────────────────────────────────────────────────────────
  backend:
    image: nireekshithkumar/projectbyshahin:backend-v1
    container_name: scholarsetu_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_opportunities --noinput 2>/dev/null || true &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile -"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker ───────────────────────────────────────────────────────────
  celery_worker:
    image: nireekshithkumar/projectbyshahin:backend-v1
    container_name: scholarsetu_celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info -Q notifications,celery --concurrency=2
    environment:
      <<: *backend-env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  # ── Celery Beat (Scheduler) ─────────────────────────────────────────────────
  celery_beat:
    image: nireekshithkumar/projectbyshahin:backend-v1
    container_name: scholarsetu_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    environment:
      <<: *backend-env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  # ── React Frontend (nginx) ──────────────────────────────────────────────────
  frontend:
    image: nireekshithkumar/projectbyshahin:frontend-v1
    container_name: scholarsetu_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
